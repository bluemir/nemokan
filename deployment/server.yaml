apiVersion: v1
kind: ConfigMap
metadata:
  name: monosketch-config
data:
  config.yaml: |
    # config file
    # auth:
    #   passkey:
    #     # WebAuthn Relying Party. 비워두면 요청 host/origin 을 쓴다.
    #     displayName: monosketch
    #     id: example.com
    #     origins:
    #     - https://example.com
    # backend:
    #   documents:
    #     # 서버 문서 하나의 최대 크기
    #     maxSize: 1MiB
    #     # 익명 문서는 마지막 접근 뒤 이 기간이 지나면 지운다
    #     retention: 90d
    #     # IP 하나가 window 동안 만들 수 있는 문서 수
    #     rateLimit:
    #       create: 30
    #       window: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monosketch
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monosketch
  template:
    metadata:
      labels:
        app: monosketch
    spec:
      containers:
      - name: server
        image: ${DEPLOY_IMAGE}
        args:
          - "web"
          - "-vv"
          - "server"
          - "--bind=:8080"
          - "--config=/var/run/monosketch/config/config.yaml"
        env:
          - name: "TZ"
            value: "Asia/Seoul"
        ports:
        - name: http
          containerPort: 8080
        - name: admin
          containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /ping
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ping
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          readOnly: true
          mountPath: /var/run/monosketch/config
        - name: volume
          mountPath: /var/run/monosketch/volume
      volumes:
      - name: config
        configMap:
          name: monosketch-config
      - name: volume
        persistentVolumeClaim:
          claimName: monosketch-pvc
---
kind: Service
apiVersion: v1
metadata:
  name: monosketch
spec:
  selector:
    app: monosketch
  ports:
  - port: 80
    targetPort: http
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monosketch-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
