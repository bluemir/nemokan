<!DOCTYPE html>
<html>
	<head>
		<title>monosketch - Editor</title>
		{{ template "snippet/header.html" . }}
		<script src="/static/{{rev .}}/bundle/wasm/wasm_exec.js"></script>
		<style>
			/* @font-face does not work inside a shadow root, so it is here. See ADR-0009. */
			@font-face {
				font-family: "D2Coding";
				src: url("/static/{{rev .}}/bundle/d2coding/D2Coding.ttf") format("truetype");
				font-display: block;
			}
			html, body {
				height: 100%;
				margin: 0;
			}
			mono-editor {
				height: 100%;
			}
		</style>
	</head>
	<body>
		<!-- server-id is set on /p/<id>, where the document is synced with the server. See ADR-0011. -->
		<mono-editor wasm-src="/static/{{rev .}}/bundle/wasm/monosketch.wasm" {{with .Param "id"}}server-id="{{.}}"{{end}}></mono-editor>
	</body>
</html>
