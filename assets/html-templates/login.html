<!DOCTYPE html>
<html>
	<head>
		<title>monosketch - Login</title>
		{{ template "snippet/header.html" . }}
	</head>
	<body layout="one-page">
		<header>
			<section row>
				<global-navigation-bar></global-navigation-bar>
			</section>
		</header>
		<main>
			<section row>
				<h1>Login</h1>
				<form>
					<label>Username</label>
					<section>
						<input name="username" autocomplete="username"/>
					</section>
					<label>Password</label>
					<section>
						<input name="password" type="password" autocomplete="current-password"/>
					</section>
					<div>
						<button enhanced>Login</button>
					</div>
				</form>
				<div>
					<passkey-login redirect="/">Login with Passkey</passkey-login>
				</div>
				<div>
					<a href="/users/recover">계정 복구</a>
				</div>
			</section>
		</main>
		<dialog>
			<header>
				<h1>Login Failed</h1>
			</header>
			<main><p><!-- TODO message --></p></main>
			<footer>
				<a fn href="#" role="close">Close</a>
			</footer>
		</dialog>
		<script type="module">
			import * as $ from "bm.js/bm.module.js";

			// nextPath is where to go after login: the next parameter or the page before,
			// if it is on this site and not a login or register page. Otherwise the first page.
			function nextPath() {
				for (const candidate of [new URLSearchParams(location.search).get("next"), document.referrer]) {
					if (!candidate) {
						continue;
					}
					const url = new URL(candidate, location.origin);
					if (url.origin === location.origin && !["/users/login", "/users/register"].includes(url.pathname)) {
						return url.pathname + url.search + url.hash;
					}
				}
				return "/";
			}
			const next = nextPath();
			$.get("passkey-login").setAttribute("redirect", next);

			$.get("form").on("submit", async evt => {
				evt.preventDefault();

				try {
					let fd = new FormData(evt.target);

					let res = await $.request("POST", `/api/v1/login`, {body:fd});

					location.href = next;
				} catch(e) {
					console.log(e);
					// TODO render message to html
					//
					$.get( "dialog").showModal();
				}
			});

			$.get("dialog").on("click", $.closeDialog);
			$.get(`dialog [role="close"]`).on("click", evt => {
				evt.preventDefault()
				evt.target.closest("dialog").close();
			});
		</script>
	</body>
</html>
